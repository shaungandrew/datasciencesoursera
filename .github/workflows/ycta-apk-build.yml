name: YCTA APK Build

on:
  push:
    branches:
      - 'chatgpt-ycta-public-run-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd ycta-build
          gradle --no-daemon :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../YCTA_Member_Native_V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YCTA_Member_Native_V1_APK
          path: YCTA_Member_Native_V1.apk
          if-no-files-found: error
