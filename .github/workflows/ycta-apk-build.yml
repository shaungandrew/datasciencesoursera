name: YCTA APK Build V2

on:
  push:
    branches:
      - 'chatgpt-ycta-v2-run-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd ycta-build
          gradle --no-daemon :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../YCTA_Member_Native_V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YCTA_Member_Native_V2_APK
          path: YCTA_Member_Native_V2.apk
          if-no-files-found: error
