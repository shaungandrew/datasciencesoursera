name: KILO TAXI Lite Smart V6 APKs

on:
  push:
    branches:
      - 'chatgpt-kilotaxi-lite-v6-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V6 Lite role APKs
        run: |
          cd kilo-suite
          gradle --no-daemon :callcenter:assembleDebug :driver:assembleDebug :passenger:assembleDebug --stacktrace
          cp callcenter/build/outputs/apk/debug/callcenter-debug.apk ../KILO_TAXI_CallCenter_V6_Lite.apk
          cp driver/build/outputs/apk/debug/driver-debug.apk ../KILO_TAXI_Driver_V6_Lite.apk
          cp passenger/build/outputs/apk/debug/passenger-debug.apk ../KILO_TAXI_Passenger_V6_Lite.apk
      - name: Upload V6 Lite APKs
        uses: actions/upload-artifact@v4
        with:
          name: KILO_TAXI_Lite_Smart_V6_APKs
          path: |
            KILO_TAXI_CallCenter_V6_Lite.apk
            KILO_TAXI_Driver_V6_Lite.apk
            KILO_TAXI_Passenger_V6_Lite.apk
          if-no-files-found: error
