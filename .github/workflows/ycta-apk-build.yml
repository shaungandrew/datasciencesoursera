name: KILO TAXI Communication V5 APKs

on:
  push:
    branches:
      - 'chatgpt-kilotaxi-communication-v5-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V5 role APKs
        run: |
          cd kilo-suite
          gradle --no-daemon :callcenter:assembleDebug :driver:assembleDebug :passenger:assembleDebug --stacktrace
          cp callcenter/build/outputs/apk/debug/callcenter-debug.apk ../KILO_TAXI_CallCenter_V5.apk
          cp driver/build/outputs/apk/debug/driver-debug.apk ../KILO_TAXI_Driver_V5.apk
          cp passenger/build/outputs/apk/debug/passenger-debug.apk ../KILO_TAXI_Passenger_V5.apk
      - name: Upload V5 APKs
        uses: actions/upload-artifact@v4
        with:
          name: KILO_TAXI_Communication_V5_APKs
          path: |
            KILO_TAXI_CallCenter_V5.apk
            KILO_TAXI_Driver_V5.apk
            KILO_TAXI_Passenger_V5.apk
          if-no-files-found: error
