name: KILO TAXI Core V3 APK

on:
  push:
    branches:
      - 'chatgpt-kilotaxi-core-v3-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          cd kilo-booking
          gradle --no-daemon :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../KILO_TAXI_Core_V3_YCTA.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KILO_TAXI_Core_V3_YCTA_APK
          path: KILO_TAXI_Core_V3_YCTA.apk
          if-no-files-found: error
