name: KILO TAXI Production Suite V4 APKs

on:
  push:
    branches:
      - 'chatgpt-kilotaxi-suite-v4-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build all role APKs
        run: |
          cd kilo-suite
          gradle --no-daemon :callcenter:assembleDebug :driver:assembleDebug :passenger:assembleDebug --stacktrace
          cp callcenter/build/outputs/apk/debug/callcenter-debug.apk ../KILO_TAXI_CallCenter_V4.apk
          cp driver/build/outputs/apk/debug/driver-debug.apk ../KILO_TAXI_Driver_V4.apk
          cp passenger/build/outputs/apk/debug/passenger-debug.apk ../KILO_TAXI_Passenger_V4.apk
      - name: Upload role APKs
        uses: actions/upload-artifact@v4
        with:
          name: KILO_TAXI_Production_Suite_V4_APKs
          path: |
            KILO_TAXI_CallCenter_V4.apk
            KILO_TAXI_Driver_V4.apk
            KILO_TAXI_Passenger_V4.apk
          if-no-files-found: error
