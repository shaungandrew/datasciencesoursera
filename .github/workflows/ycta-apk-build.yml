name: KILO TAXI Driver Native V6.2.1 Activation Fix

on:
  push:
    branches:
      - 'chatgpt-kilotaxi-driver-v6-2-1-activation-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Driver V6.2.1
        run: |
          cd kilo-suite
          gradle --no-daemon :driver:assembleDebug --stacktrace
          cp driver/build/outputs/apk/debug/driver-debug.apk ../KILO_TAXI_Driver_Native_V6_2_1.apk
      - name: Upload Driver V6.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: KILO_TAXI_Driver_Native_V6_2_1_APK
          path: KILO_TAXI_Driver_Native_V6_2_1.apk
          if-no-files-found: error
