name: Build AAII MOOC PC V1.1.1 Standalone

on:
  push:
    branches:
      - aaii-mooc-pc-v111-standalone-fix
    paths:
      - '.github/workflows/aaii-mooc-pc-v111-standalone-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "aaii-mooc-pc-v1/source.b64.*" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $bytes = [Convert]::FromBase64String(($b64 -replace "\s",""))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\AAII_MOOC_PC_V1_FULL_SOURCE.zip",$bytes)
          $hash=(Get-FileHash "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_FULL_SOURCE.zip" -Algorithm SHA256).Hash.ToLower()
          if($hash -ne "d2cba38223c58d2b2b73cd19ff5378794accd8a7459956e9e26c4d3447e413a3"){ throw "Source ZIP checksum mismatch: $hash" }
          Expand-Archive "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_FULL_SOURCE.zip" "$env:RUNNER_TEMP\src" -Force

      - name: Apply V1.1 UI patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "aaii-mooc-pc-v11/v11.patch.gz.b64.*" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $bytes = [Convert]::FromBase64String(($b64 -replace "\s",""))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\v11.patch.gz",$bytes)
          $hash=(Get-FileHash "$env:RUNNER_TEMP\v11.patch.gz" -Algorithm SHA256).Hash.ToLower()
          if($hash -ne "39bb42cb5de1f387aafd7c5f8caa891c580d5278c8dc712d91680165b2c3453d"){ throw "V1.1 patch checksum mismatch: $hash" }
          gzip -d -c "$env:RUNNER_TEMP\v11.patch.gz" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\v11.patch"
          Push-Location "$env:RUNNER_TEMP\src"
          & patch -p1 --batch -i "$env:RUNNER_TEMP\v11.patch"
          $code=$LASTEXITCODE
          if($code -gt 1){ throw "Patch failed with exit code $code" }
          $global:LASTEXITCODE=0
          Pop-Location
          if(!(Test-Path "$env:RUNNER_TEMP\src\AAII_MOOC_PC_V1_FULL_SOURCE\README_V1.1.txt")){ throw "V1.1 patch did not apply" }

      - name: Apply V1.1.1 startup and standalone fixes
        shell: pwsh
        run: |
          $root="$env:RUNNER_TEMP\src\AAII_MOOC_PC_V1_FULL_SOURCE"
          $app=@'
using System.IO;
using AAIIMoocPC.Services;
using System.Windows;
using System.Windows.Threading;
namespace AAIIMoocPC;
public partial class App : Application
{
 public App()
 {
  DispatcherUnhandledException += OnUiError;
  AppDomain.CurrentDomain.UnhandledException += (_,e)=>{ if(e.ExceptionObject is Exception ex) Log(ex); };
  TaskScheduler.UnobservedTaskException += (_,e)=>{ Log(e.Exception); e.SetObserved(); };
 }
 private async void Application_Startup(object sender, StartupEventArgs e)
 {
  ShutdownMode = ShutdownMode.OnExplicitShutdown;
  SplashWindow? splash = null;
  try
  {
   LogText("Startup begin");
   System.Windows.Media.RenderOptions.ProcessRenderMode = System.Windows.Interop.RenderMode.SoftwareOnly;
   try
   {
    splash = new SplashWindow();
    splash.Show();
    await Task.Delay(650);
   }
   catch(Exception splashEx)
   {
    Log(splashEx);
    splash = null;
   }
   var w = new MainWindow();
   MainWindow = w;
   w.Show();
   try { splash?.Close(); } catch { }
   LogText("Main window shown");
  }
  catch(Exception ex)
  {
   try { splash?.Close(); } catch { }
   Log(ex);
   MessageBox.Show("AAII MOOC PC V1.1.1 could not start.\n\n"+ex.Message+"\n\nCrash log:\n"+CrashLog,
     "AAII MOOC PC V1.1.1", MessageBoxButton.OK, MessageBoxImage.Error);
  }
 }
 private void OnUiError(object s, DispatcherUnhandledExceptionEventArgs e)
 {
  Log(e.Exception);
  MessageBox.Show(e.Exception.Message+"\n\nCrash log:\n"+CrashLog,
    "AAII MOOC PC V1.1.1", MessageBoxButton.OK, MessageBoxImage.Warning);
  e.Handled = true;
 }
 public static string CrashLog => Path.Combine(AppSettings.Root,"crash.log");
 public static void Log(Exception ex)
 {
  try
  {
   Directory.CreateDirectory(AppSettings.Root);
   File.AppendAllText(CrashLog,"==== "+DateTime.Now+" ====\n"+ex+"\n");
  } catch {}
 }
 public static void LogText(string text)
 {
  try
  {
   Directory.CreateDirectory(AppSettings.Root);
   File.AppendAllText(CrashLog,"==== "+DateTime.Now+" ==== "+text+"\n");
  } catch {}
 }
}
'@
          Set-Content -Path "$root\App.xaml.cs" -Value $app -Encoding utf8

          $api="$root\Services\ApiClient.cs"
          $c=Get-Content $api -Raw
          if($c -notmatch [regex]::Escape("using System.Net.Http;")){
            Set-Content -Path $api -Value ("using System.Net.Http;`r`n"+$c) -Encoding utf8
          }

          $settings="$root\Services\AppSettings.cs"
          $c=Get-Content $settings -Raw
          if($c -notmatch [regex]::Escape("using System.IO;")){
            Set-Content -Path $settings -Value ("using System.IO;`r`n"+$c) -Encoding utf8
          }

          $proj="$root\AAIIMoocPC.csproj"
          $c=Get-Content $proj -Raw
          $c=$c -replace '<Version>1\.1\.0</Version>','<Version>1.1.1</Version>'
          $c=$c -replace '<FileVersion>1\.1\.0\.0</FileVersion>','<FileVersion>1.1.1.0</FileVersion>'
          $c=$c -replace '<AssemblyVersion>1\.1\.0\.0</AssemblyVersion>','<AssemblyVersion>1.1.1.0</AssemblyVersion>'
          Set-Content -Path $proj -Value $c -Encoding utf8

          @'
AAII MOOC PC V1.1.1 — Standalone Fix

Main fix:
- The old separately downloaded EXE was only the small app host and still needed the other published DLL/runtime files beside it.
- This build publishes a TRUE self-contained single-file Windows x64 EXE.
- You can run AAII_MOOC_PC_V1_1_1_STANDALONE.exe directly.

Startup hardening:
- Splash failure no longer closes the application.
- Startup and UI exceptions are written to:
  %LOCALAPPDATA%\AAIIMoocPC\crash.log
- If startup fails after managed code begins, a visible error dialog shows the crash-log path.

Server:
https://aaii.asia/edu/mooc/api/
'@ | Set-Content "$root\README_V1.1.1.txt" -Encoding utf8

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: dotnet restore AAIIMoocPC.csproj

      - name: Build
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: dotnet build AAIIMoocPC.csproj -c Release --no-restore

      - name: Publish true standalone single EXE
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: |
          dotnet publish AAIIMoocPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=false -o "$env:RUNNER_TEMP\single"

      - name: Package outputs
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\release" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\single\AAII_MOOC_PC.exe" "$env:RUNNER_TEMP\release\AAII_MOOC_PC_V1_1_1_STANDALONE.exe" -Force
          Copy-Item "$env:RUNNER_TEMP\src\AAII_MOOC_PC_V1_FULL_SOURCE\README_V1.1.1.txt" "$env:RUNNER_TEMP\release\README_V1.1.1.txt" -Force
          Compress-Archive "$env:RUNNER_TEMP\release\*" "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_1_1_STANDALONE.zip" -Force
          Compress-Archive "$env:RUNNER_TEMP\src\AAII_MOOC_PC_V1_FULL_SOURCE\*" "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_1_1_FULL_SOURCE.zip" -Force
          Get-FileHash "$env:RUNNER_TEMP\release\AAII_MOOC_PC_V1_1_1_STANDALONE.exe" -Algorithm SHA256
          Get-FileHash "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_1_1_STANDALONE.zip" -Algorithm SHA256

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: AAII-MOOC-PC-V1.1.1-STANDALONE-EXE
          path: ${{ runner.temp }}\release\AAII_MOOC_PC_V1_1_1_STANDALONE.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AAII-MOOC-PC-V1.1.1-STANDALONE-ZIP
          path: ${{ runner.temp }}\AAII_MOOC_PC_V1_1_1_STANDALONE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: AAII-MOOC-PC-V1.1.1-SOURCE
          path: ${{ runner.temp }}\AAII_MOOC_PC_V1_1_1_FULL_SOURCE.zip
          if-no-files-found: error
          retention-days: 14
