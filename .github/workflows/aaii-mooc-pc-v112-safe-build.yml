name: Build AAII MOOC PC V1.1.2 Safe Mode

on:
  push:
    branches:
      - aaii-mooc-pc-v112-safe-mode
    paths:
      - '.github/workflows/aaii-mooc-pc-v112-safe-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V1 source
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $parts=Get-ChildItem "aaii-mooc-pc-v1/source.b64.*"|Sort-Object Name
          $b64=($parts|ForEach-Object{Get-Content $_.FullName -Raw})-join ""
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\src.zip",[Convert]::FromBase64String(($b64 -replace "\s","")))
          Expand-Archive "$env:RUNNER_TEMP\src.zip" "$env:RUNNER_TEMP\src" -Force

      - name: Apply V1.1 UI
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $parts=Get-ChildItem "aaii-mooc-pc-v11/v11.patch.gz.b64.*"|Sort-Object Name
          $b64=($parts|ForEach-Object{Get-Content $_.FullName -Raw})-join ""
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\v11.gz",[Convert]::FromBase64String(($b64 -replace "\s","")))
          gzip -d -c "$env:RUNNER_TEMP\v11.gz" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\v11.patch"
          Push-Location "$env:RUNNER_TEMP\src"
          & patch -p1 --batch -i "$env:RUNNER_TEMP\v11.patch"
          $global:LASTEXITCODE=0
          Pop-Location

      - name: Apply V1.1.2 safe startup
        shell: pwsh
        run: |
          $root="$env:RUNNER_TEMP\src\AAII_MOOC_PC_V1_FULL_SOURCE"
          [IO.File]::WriteAllBytes("$root\App.xaml",[Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("$root\App.xaml.cs",[Convert]::FromBase64String(""))

          $mw="$root\MainWindow.xaml.cs"
          $c=Get-Content $mw -Raw
          $c=$c -replace 'ContentPanel\.ItemWidth = double\.NaN;\s*',''
          $pattern='if \(!string\.IsNullOrWhiteSpace\(_settings\.Token\)\)\s*\{\s*ShowShell\(\);\s*Loaded \+= async \(_, _\) => await LoadHomeSafeAsync\(\);\s*\}'
          $c=[regex]::Replace($c,$pattern,'LoginStatus.Text = "SAFE MODE V1.1.2 — please sign in.";')
          $c=$c -replace 'c\.Effect=new DropShadowEffect\{[^;]+\};',''
          Set-Content $mw $c -Encoding utf8

          $mx="$root\MainWindow.xaml"
          $x=Get-Content $mx -Raw
          $x=[regex]::Replace($x,'<Border\.Effect>.*?</Border\.Effect>','',[Text.RegularExpressions.RegexOptions]::Singleline)
          Set-Content $mx $x -Encoding utf8

          $api="$root\Services\ApiClient.cs"
          $c=Get-Content $api -Raw
          if($c -notmatch "using System.Net.Http;"){Set-Content $api ("using System.Net.Http;`r`n"+$c) -Encoding utf8}
          $settings="$root\Services\AppSettings.cs"
          $c=Get-Content $settings -Raw
          if($c -notmatch "using System.IO;"){Set-Content $settings ("using System.IO;`r`n"+$c) -Encoding utf8}

          $proj="$root\AAIIMoocPC.csproj"
          $c=Get-Content $proj -Raw
          $c=$c -replace '<Version>1\.1\.0</Version>|<Version>1\.1\.1</Version>','<Version>1.1.2</Version>'
          $c=$c -replace '<FileVersion>1\.1\.0\.0</FileVersion>|<FileVersion>1\.1\.1\.0</FileVersion>','<FileVersion>1.1.2.0</FileVersion>'
          $c=$c -replace '<AssemblyVersion>1\.1\.0\.0</AssemblyVersion>|<AssemblyVersion>1\.1\.1\.0</AssemblyVersion>','<AssemblyVersion>1.1.2.0</AssemblyVersion>'
          Set-Content $proj $c -Encoding utf8

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: |
          dotnet restore AAIIMoocPC.csproj
          dotnet build AAIIMoocPC.csproj -c Release --no-restore

      - name: Publish x64 portable folder
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: dotnet publish AAIIMoocPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP\x64"

      - name: Publish x86 portable folder
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: dotnet publish AAIIMoocPC.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP\x86"

      - name: Package
        shell: pwsh
        run: |
          "Run AAII_MOOC_PC.exe from this extracted folder. Do NOT move only the EXE." | Set-Content "$env:RUNNER_TEMP\x64\RUN_README.txt"
          "Run AAII_MOOC_PC.exe from this extracted folder. Do NOT move only the EXE." | Set-Content "$env:RUNNER_TEMP\x86\RUN_README.txt"
          Compress-Archive "$env:RUNNER_TEMP\x64\*" "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_1_2_SAFE_X64.zip" -Force
          Compress-Archive "$env:RUNNER_TEMP\x86\*" "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_1_2_SAFE_X86.zip" -Force
          Compress-Archive "$env:RUNNER_TEMP\src\AAII_MOOC_PC_V1_FULL_SOURCE\*" "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_1_2_SOURCE.zip" -Force

      - name: Upload x64
        uses: actions/upload-artifact@v4
        with:
          name: AAII-MOOC-PC-V1.1.2-SAFE-X64
          path: ${{ runner.temp }}\AAII_MOOC_PC_V1_1_2_SAFE_X64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86
        uses: actions/upload-artifact@v4
        with:
          name: AAII-MOOC-PC-V1.1.2-SAFE-X86
          path: ${{ runner.temp }}\AAII_MOOC_PC_V1_1_2_SAFE_X86.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: AAII-MOOC-PC-V1.1.2-SOURCE
          path: ${{ runner.temp }}\AAII_MOOC_PC_V1_1_2_SOURCE.zip
          if-no-files-found: error
          retention-days: 14
