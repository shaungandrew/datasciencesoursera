name: Build AAII MOOC PC V1.1

on:
  push:
    branches:
      - aaii-mooc-pc-v11-build
    paths:
      - '.github/workflows/aaii-mooc-pc-v11-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "aaii-mooc-pc-v1/source.b64.*" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $bytes = [Convert]::FromBase64String(($b64 -replace "\s",""))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\AAII_MOOC_PC_V1_FULL_SOURCE.zip",$bytes)
          $hash=(Get-FileHash "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_FULL_SOURCE.zip" -Algorithm SHA256).Hash.ToLower()
          if($hash -ne "d2cba38223c58d2b2b73cd19ff5378794accd8a7459956e9e26c4d3447e413a3"){ throw "Source ZIP checksum mismatch: $hash" }
          Expand-Archive "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_FULL_SOURCE.zip" "$env:RUNNER_TEMP\src" -Force

      - name: Apply V1.1 UI patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "aaii-mooc-pc-v11/v11.patch.gz.b64.*" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $bytes = [Convert]::FromBase64String(($b64 -replace "\s",""))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\v11.patch.gz",$bytes)
          $hash=(Get-FileHash "$env:RUNNER_TEMP\v11.patch.gz" -Algorithm SHA256).Hash.ToLower()
          if($hash -ne "39bb42cb5de1f387aafd7c5f8caa891c580d5278c8dc712d91680165b2c3453d"){ throw "V1.1 patch checksum mismatch: $hash" }
          gzip -d -c "$env:RUNNER_TEMP\v11.patch.gz" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\v11.patch"
          Push-Location "$env:RUNNER_TEMP\src"
          Get-Content "$env:RUNNER_TEMP\v11.patch" -Raw | patch -p1 --batch
          if($LASTEXITCODE -gt 1){ throw "Patch failed with exit code $LASTEXITCODE" }
          $app = @'
using System.IO;
using AAIIMoocPC.Services;
using System.Windows;
using System.Windows.Threading;
namespace AAIIMoocPC;
public partial class App : Application
{
 public App(){DispatcherUnhandledException+=OnUiError;AppDomain.CurrentDomain.UnhandledException+=(_,e)=>{if(e.ExceptionObject is Exception ex)Log(ex);};TaskScheduler.UnobservedTaskException+=(_,e)=>{Log(e.Exception);e.SetObserved();};}
 private async void Application_Startup(object sender,StartupEventArgs e)
 {
  SplashWindow? splash=null;
  try
  {
   System.Windows.Media.RenderOptions.ProcessRenderMode=System.Windows.Interop.RenderMode.SoftwareOnly;
   splash=new SplashWindow();splash.Show();await Task.Delay(850);
   var w=new MainWindow();MainWindow=w;w.Show();splash.Close();
  }
  catch(Exception ex){try{splash?.Close();}catch{}Log(ex);MessageBox.Show("AAII MOOC PC V1.1 could not start.\n\n"+ex.Message+"\n\n"+CrashLog,"AAII MOOC PC V1.1",MessageBoxButton.OK,MessageBoxImage.Error);Shutdown(1);}
 }
 private void OnUiError(object s,DispatcherUnhandledExceptionEventArgs e){Log(e.Exception);MessageBox.Show(e.Exception.Message,"AAII MOOC PC V1.1",MessageBoxButton.OK,MessageBoxImage.Warning);e.Handled=true;}
 public static string CrashLog=>Path.Combine(AppSettings.Root,"crash.log");
 public static void Log(Exception ex){try{Directory.CreateDirectory(AppSettings.Root);File.AppendAllText(CrashLog,"==== "+DateTime.Now+" ====\n"+ex+"\n");}catch{}}
}
'@
          Set-Content -Path "AAII_MOOC_PC_V1_FULL_SOURCE\App.xaml.cs" -Value $app -Encoding utf8
          Remove-Item "AAII_MOOC_PC_V1_FULL_SOURCE\App.xaml.cs.rej" -ErrorAction SilentlyContinue
          Pop-Location

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: dotnet restore AAIIMoocPC.csproj

      - name: Build
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: dotnet build AAIIMoocPC.csproj -c Release --no-restore

      - name: Publish Windows x64 portable
        shell: pwsh
        working-directory: ${{ runner.temp }}\src\AAII_MOOC_PC_V1_FULL_SOURCE
        run: dotnet publish AAIIMoocPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP\publish"

      - name: Package portable build
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Copy-Item "$env:RUNNER_TEMP\src\AAII_MOOC_PC_V1_FULL_SOURCE\README_V1.1.txt" "$env:RUNNER_TEMP\publish\README_V1.1.txt" -Force
          Compress-Archive "$env:RUNNER_TEMP\publish\*" "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_1_PORTABLE.zip" -Force
          Get-FileHash "$env:RUNNER_TEMP\AAII_MOOC_PC_V1_1_PORTABLE.zip" -Algorithm SHA256
          Get-FileHash "$env:RUNNER_TEMP\publish\AAII_MOOC_PC.exe" -Algorithm SHA256

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AAII-MOOC-PC-V1.1-PORTABLE
          path: ${{ runner.temp }}\AAII_MOOC_PC_V1_1_PORTABLE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AAII-MOOC-PC-V1.1-EXE
          path: ${{ runner.temp }}\publish\AAII_MOOC_PC.exe
          if-no-files-found: error
          retention-days: 14
