name: Build AAII Panyar Home V4.5.7 APK

on:
  push:
    branches:
      - aaii-apk-v457-build
    paths:
      - '.github/workflows/aaii-v457-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Restore AAII source
        shell: bash
        run: |
          set -euo pipefail
          cat aaii-apk-v457/source.b64.* | tr -d '\r\n' | base64 -d > /tmp/aaii-source.zip
          echo "21080623ed954022265e5fb3aa01c809d74a851b033069b09aecd97bfe1d1b7a  /tmp/aaii-source.zip" | sha256sum -c -
          unzip -t /tmp/aaii-source.zip
          mkdir -p /tmp/aaii-source
          unzip -q /tmp/aaii-source.zip -d /tmp/aaii-source
          test -f /tmp/aaii-source/settings.gradle
          test -f /tmp/aaii-source/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: /tmp/aaii-source
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release
          cp /tmp/aaii-source/app/build/outputs/apk/debug/app-debug.apk release/AAII_Panyar_Home_Native_V4_5_7_MOOC_3D_Adviser.apk
          sha256sum release/AAII_Panyar_Home_Native_V4_5_7_MOOC_3D_Adviser.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAII-Panyar-Home-V4.5.7-APK
          path: release/AAII_Panyar_Home_Native_V4_5_7_MOOC_3D_Adviser.apk
          if-no-files-found: error
          retention-days: 14
